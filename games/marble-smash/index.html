/* =====================================================================
   11C LOCK + KEY (Level 2) — locked voxel groups opened by key boxes.
   Filling a key box sends a key flying up to the next locked group and
   unlocks it; until then shots on locked voxels have no effect (see blastAt).
   ===================================================================== */
const Locks = {
  queue: [],    // groups not yet unlocked, opened in this order
  flights: [],  // {t, dur, sx, sy, group}
  anims: [],    // unlock pops: {group, x, y, t}
  shake: {},    // group -> shake intensity, bumped when a locked voxel is hit
  reset() {
    this.flights.length = 0;
    this.anims.length = 0;
    this.shake = {};
    this.queue = ['eyeL', 'eyeR', 'mouth']
      .filter(g => Entities.voxels.some(v => v.lockGroup === g && v.locked));
  },
  get active() { return this.queue.length > 0 || this.flights.length > 0; },
  launch(box) {
    const group = this.queue.shift();
    if (!group) return;
    this.flights.push({ t: 0, dur: 0.85, sx: box.x, sy: box.y + 0.25, group });
    SFX.whip();
  },
  groupCenter(group) {
    let n = 0, x = 0, y = 0, depth = 0;
    for (const v of Entities.voxels) {
      if (v.lockGroup !== group || !v.alive) continue;
      const p = Object3D.center(v);
      x += p.x; y += p.y; depth += p.depth; n++;
    }
    return n ? { x: x / n, y: y / n, depth: depth / n } : { x: 0, y: Object3D.pivotY, depth: 0 };
  },
  // key position along its arc; group center is re-read every frame so the
  // key homes in even while the object is being rotated
  pos(f) {
    const k = Ease.outQuad(Math.min(1, f.t / f.dur));
    const c = this.groupCenter(f.group);
    return { x: f.sx + (c.x - f.sx) * k, y: f.sy + (c.y - f.sy) * k + Math.sin(Math.PI * k) * 0.9, k };
  },
  update(dt) {
    for (const g of Object.keys(this.shake))
      this.shake[g] = Math.max(0, this.shake[g] - dt * 2.6);
    for (let i = this.anims.length - 1; i >= 0; i--) {
      this.anims[i].t += dt;
      if (this.anims[i].t >= 0.75) this.anims.splice(i, 1);
    }
    for (let i = this.flights.length - 1; i >= 0; i--) {
      const f = this.flights[i];
      f.t += dt;
      if (f.t >= f.dur) {
        const c = this.groupCenter(f.group);
        for (const v of Entities.voxels) {
          if (v.lockGroup === f.group && v.locked) {
            v.locked = false;
            v.hitFlash = 1;
            const p = Object3D.center(v);
            Particles.dust(p.x, p.y);
          }
        }
        // pronounced unlock feedback: lock pops open, burst + confetti + kick
        this.anims.push({ group: f.group, x: c.x, y: c.y, t: 0 });
        Particles.ring(c.x, c.y, '#ffd34d', 0.85);
        Particles.confetti(c.x, c.y);
        Cam.addTrauma(0.14);
        SFX.melt();
        Haptics.buzz([15, 25, 15]);
        this.flights.splice(i, 1);
      }
    }
  },
};

/* =====================================================================
   12 CONVEYOR — stadium rail, verbatim port of ConveyorManager.cs
   ===================================================================== */
const Conveyor = {
  baseOffset: 0,
  slotBalls: new Array(SLOT_COUNT).fill(null),
  slotSettled: new Array(SLOT_COUNT).fill(false),
  count: 0,
  warnFlash: 0,
  dangerActive: false,
  dangerTimer: 0,
  dangerDuration: 2.0,

  reset() {
    this.baseOffset = 0;
    this.slotBalls.fill(null);
    this.slotSettled.fill(false);
    this.count = 0;
    this.warnFlash = 0;
    this.dangerActive = false;
    this.dangerTimer = 0;
  },

  beginDanger() {
    if (this.dangerActive || Game.state !== 'playing') return;
    this.dangerActive = true;
    this.dangerTimer = this.dangerDuration;
    this.warnFlash = this.dangerDuration;
    SFX.railWarn(1);
    Haptics.buzz([25, 35, 25]);
  },

  cancelDanger() {
    this.dangerActive = false;
    this.dangerTimer = 0;
  },

  slotDistance(i) {
    let d = (this.baseOffset + i * RAIL_SLOT_SPACING) % PATH_LENGTH;
    return d < 0 ? d + PATH_LENGTH : d;
  },

  // Path: top lane left->right, right cap, bottom lane right->left, left cap.
  pathPoint(d) {
    const L = Tuning.LANE_LENGTH, r = Tuning.LANE_HALF_HEIGHT;
    const half = L * 0.5, capLen = Math.PI * r;
    let lx, ly;
    if (d < L) { lx = -half + d; ly = r; }
    else if (d < L + capLen) {
      const a = (d - L) / r;
      lx = half + Math.sin(a) * r; ly = Math.cos(a) * r;
    } else if (d < 2 * L + capLen) {
      lx = half - (d - L - capLen); ly = -r;
    } else {
      const a = (d - 2 * L - capLen) / r;
      lx = -half - Math.sin(a) * r; ly = -Math.cos(a) * r;
    }
    return { x: lx, y: Tuning.CONVEYOR_Y + ly };
  },

  inDispatchZone(d) {
    const L = Tuning.LANE_LENGTH, capLen = Math.PI * Tuning.LANE_HALF_HEIGHT;
    if (d < L + capLen || d > 2 * L + capLen) return false;
    const x = L * 0.5 - (d - L - capLen);
    return Math.abs(x) < Tuning.DISPATCH_HALF_WIDTH;
  },

  update(dt) {
    this.baseOffset = (this.baseOffset + Tuning.BELT_SPEED * dt) % PATH_LENGTH;
    this.warnFlash = Math.max(0, this.warnFlash - dt);
    for (let i = 0; i < SLOT_COUNT; i++) {
      const ball = this.slotBalls[i];
      if (!ball || !this.slotSettled[i]) continue;
      const d = this.slotDistance(i);
      const p = this.pathPoint(d);
      ball.x = p.x; ball.y = p.y;
      if (this.inDispatchZone(d)) {
        const box = Boxes.getOpenBox(ball.color);
        if (box) this.dispatch(i, ball, box);
      }
    }

    // Full rail: only a true dead-end fails the run. While any queued marble
    // still matches an open box it WILL dispatch once it circulates to the
    // dispatch zone (a full loop takes ~5.4s), so hold the countdown instead
    // of expiring before the rescue can physically arrive. The 2-second fail
    // countdown only ticks while no queued marble can go anywhere.
    if (this.count >= CAPACITY) {
      this.beginDanger();
      if (this.dangerActive) {
        const rescuable = this.slotBalls.some(b => b && Boxes.getOpenBox(b.color));
        if (rescuable) {
          this.dangerTimer = this.dangerDuration;
        } else {
          this.dangerTimer = Math.max(0, this.dangerTimer - dt);
          if (this.dangerTimer <= 0) Game.fail('Conveyor jammed — no matching box!');
        }
      }
    } else if (this.dangerActive) {
      // At least one marble dispatched, so the jam has been relieved.
      this.cancelDanger();
    }
  },

  tryCapture(m) {
    if (Game.state !== 'playing') return;
    // A full rail no longer fails instantly. Start/continue the 2-second jam
    // countdown and keep the marble in play while we wait for a slot to open.
    if (this.count >= CAPACITY) {
      this.beginDanger();
      m.vy = Math.max(m.vy, 1.1);
      m.y += 0.04;
      return;
    }
    let best = -1, bestDist = Infinity;
    for (let i = 0; i < SLOT_COUNT; i++) {
      if (this.slotBalls[i]) continue;
      const p = this.pathPoint(this.slotDistance(i));
      const dx = p.x - m.x, dy = p.y - m.y;
      const dd = dx * dx + dy * dy;
      if (dd < bestDist) { bestDist = dd; best = i; }
    }
    if (best < 0) {
      this.beginDanger();
      m.vy = Math.max(m.vy, 1.1);
      return;
    }

    m.state = 'capturing';
    m.slot = best;
    this.slotBalls[best] = m;
    this.count++;
    if (this.count >= CAPACITY) this.beginDanger();
    const fromX = m.x, fromY = m.y;
    const slot = best, mm = m;
    Tween.add({
      dur: Tuning.T_CAPTURE, ease: Ease.outQuad,
      update: k => {
        const p = this.pathPoint(this.slotDistance(slot));
        mm.x = fromX + (p.x - fromX) * k;
        mm.y = fromY + (p.y - fromY) * k;
      },
      done: () => {
        this.slotSettled[slot] = true;
        mm.state = 'riding';
        mm.sy = 0.65; mm.syV = 0; // land squash
        Particles.dust(mm.x, mm.y - mm.r);
      },
    });
    SFX.railLand();
    // fairness feedback: warn as the rail approaches capacity — subtle only
    // (rail flash + sound + haptic); no center-screen toasts, they distract.
    if (this.count >= Tuning.RAIL_WARN_AT) {
      this.warnFlash = 0.6;
      SFX.railWarn((this.count - Tuning.RAIL_WARN_AT) / (CAPACITY - Tuning.RAIL_WARN_AT));
      if (this.count === CAPACITY - 1) Haptics.buzz(30);
    }
  },

  dispatch(slot, ball, box) {
    this.slotBalls[slot] = null;
    this.slotSettled[slot] = false;
    this.count--;
    box.reserved++;
    const idx = box.placed + box.reserved - 1;
    ball.state = 'jumping';
    ball.sy = 1.25;
    const fromX = ball.x, fromY = ball.y;
    const bb = ball, target = box;
    Tween.add({
      dur: Tuning.T_JUMP, ease: Ease.linear,
      update: (k) => {
        const to = target.slotPos(idx);
        bb.x = fromX + (to.x - fromX) * k;
        bb.y = fromY + (to.y - fromY) * k + Tuning.JUMP_ARC * 4 * k * (1 - k);
      },
      done: () => Boxes.place(target, bb, idx),
    });
    SFX.whip();
  },
};

/* =====================================================================
   13 BOXES — port of BoxGridManager.cs + ColorBox.cs
   ===================================================================== */
const Boxes = {
  columns: [],
  totalBoxes: 0,
  bobT: 0,

  // largest-remainder proportional interleave (order = counts insertion order,
  // matching the C# Dictionary semantics of the original)
  init(counts) {
    this.columns.length = 0;
    this.bobT = 0;
    const totals = {};
    for (const k of Object.keys(counts)) totals[k] = Math.floor(counts[k] / 3);
    const remaining = Object.assign({}, totals);
    const boxCount = Object.values(totals).reduce((a, b) => a + b, 0);
    const order = [];
    for (let i = 0; i < boxCount; i++) {
      let best = null, bestScore = -1;
      for (const k of Object.keys(remaining)) {
        if (remaining[k] <= 0) continue;
        const score = remaining[k] / totals[k];
        if (score > bestScore) { bestScore = score; best = k; }
      }
      order.push(best);
      remaining[best]--;
    }

    // Optional level rule (frontBoxColor): make the first visible row a single
    // color so wrong-color marbles can intentionally jam the rail. Unused by
    // the current level set.
    const frontColor = Game.currentLevel().frontBoxColor;
    if (frontColor && (totals[frontColor] || 0) >= Tuning.GRID_COLUMNS) {
      let skip = Tuning.GRID_COLUMNS;
      const rest = [];
      for (const color of order) {
        if (color === frontColor && skip > 0) { skip--; continue; }
        rest.push(color);
      }
      order.length = 0;
      for (let i = 0; i < Tuning.GRID_COLUMNS; i++) order.push(frontColor);
      order.push(...rest);
    }

    for (let c = 0; c < Tuning.GRID_COLUMNS; c++) this.columns.push([]);
    for (let i = 0; i < order.length; i++) {
      const col = i % Tuning.GRID_COLUMNS;
      const row = this.columns[col].length;
      const pos = this.boxPosition(col, row);
      this.columns[col].push({
        color: order[i], placed: 0, reserved: 0,
        x: pos.x, y: pos.y, scale: 1,
        visible: row < Tuning.VISIBLE_ROWS,
        marbles: [null, null, null],
        // world position of slot i on the box lip (ColorBox.SlotOffset)
        slotPos(i) { return { x: this.x + (i - 1) * 0.23, y: this.y + 0.11 }; },
      });
    }
    this.totalBoxes = order.length;

    // Ice/flamethrower support stays available for levels that actually contain ice.
    // The current JSON Level 3 has no ice, so no flamethrower hatch is spawned there.
    if (Game.levelIndex === 2 && Entities.voxels.some(v => v.iced)) {
      const triggerColor = 'teal';
      let trigger = null;
      for (const column of this.columns) {
        const front = column[0];
        if (front && front.color === triggerColor) { trigger = front; break; }
      }
      if (!trigger) {
        for (const column of this.columns) {
          trigger = column.find(b => b.color === triggerColor);
          if (trigger) break;
        }
      }
      if (trigger) trigger.flameTrigger = true;
    }

    // Lock & key: one key box per locked group. Keys are YELLOW boxes because
    // brown/red marbles only come from the locked blocks themselves — a
    // brown/red key box could never be filled. Keys are placed as close to the
    // front row as possible (spread across columns) so unlocking starts early.
    const lockGroups = new Set(Entities.voxels.filter(v => v.locked).map(v => v.lockGroup)).size;
    if (lockGroups > 0) {
      let assigned = 0;
      for (let row = 0; assigned < lockGroups && row < 20; row++) {
        for (const column of this.columns) {
          if (assigned >= lockGroups) break;
          const b = column[row];
          if (b && b.color === 'yellow' && !b.isKey) { b.isKey = true; assigned++; }
        }
      }
    }
  },

  boxPosition(col, row) {
    return {
      x: (col - (Tuning.GRID_COLUMNS - 1) * 0.5) * Tuning.COLUMN_SPACING,
      y: Tuning.BOX_TOP_Y - row * Tuning.ROW_SPACING,
    };
  },

  getOpenBox(color) {
    for (const column of this.columns) {
      if (!column.length) continue;
      const front = column[0];
      if (front.color === color && front.placed + front.reserved < Tuning.BOX_CAPACITY && !front.clearing)
        return front;
    }
    return null;
  },

  place(box, marble, idx) {
    box.reserved--;
    box.placed++;
    marble.state = 'boxed';
    marble.box = box;
    marble.slotIdx = idx;
    marble.r = 0.1;
    marble.sy = 0.6; marble.syV = 0;
    box.scale = 1.06; // little receive bump
    Tween.add({ dur: 0.12, ease: Ease.outQuad, update: (k) => { box.scale = 1.06 - 0.06 * k; } });
    box.marbles[idx] = marble;
    SFX.boxCatch(box.placed);

    if (box.placed >= Tuning.BOX_CAPACITY) {
      box.clearing = true;
      const b = box;
      const flameSequence = !!box.flameTrigger && IceBlocker.trigger(box);
      if (box.isKey) Locks.launch(box); // filled key box: fly the key to its lock group
      const beginClear = () => {
        // anticipation -> punch -> clear
        Tween.add({
          dur: 0.07, ease: Ease.outQuad,
          update: k => { b.scale = 1 - 0.14 * k; },
          done: () => Tween.add({
            dur: Tuning.T_BOX_POP, ease: Ease.outBack,
            update: k => { b.scale = 0.86 + 0.44 * k; },
            done: () => this.clearBox(b),
          }),
        });
      };
      if (flameSequence) Tween.delay(1.40, beginClear);
      else beginClear();
    }
  },

  clearBox(box) {
    for (const m of box.marbles) if (m) Entities.removeMarble(m);
    Particles.confetti(box.x, box.y + 0.1);
    Particles.ring(box.x, box.y, Palette[box.color].base, 0.7);
    Cam.addTrauma(0.15);
    Haptics.buzz([15, 30, 15]);
    Game.onBoxCleared(box);

    this.totalBoxes--;
    const column = this.columns.find(c => c.includes(box));
    if (column) {
      const colIndex = this.columns.indexOf(column);
      column.splice(column.indexOf(box), 1);
      for (let r = 0; r < column.length; r++) {
        const b = column[r];
        if (r < Tuning.VISIBLE_ROWS) b.visible = true;
        const to = this.boxPosition(colIndex, r);
        const fx = b.x, fy = b.y;
        Tween.add({
          dur: Tuning.T_BOX_SHIFT, ease: Ease.outBack,
          update: k => { b.x = fx + (to.x - fx) * k; b.y = fy + (to.y - fy) * k; },
        });
      }
      if (column.length) SFX.shiftUp();
    }
    if (this.totalBoxes <= 0) Game.win();
  },

  update(dt) { this.bobT += dt; },
};

/* =====================================================================
   14 CANNON — port of CannonController.cs
   ===================================================================== */
const Cannon = {
  x: 0, y: Tuning.CANNON_Y,
  angle: Math.PI / 2, targetAngle: Math.PI / 2,
  recoil: 0, cooldown: 0,
  ammo: Tuning.AMMO, inFlight: 0,

  reset() {
    this.angle = this.targetAngle = Math.PI / 2;
    this.recoil = 0; this.cooldown = 0;
    this.ammo = Infinity; this.inFlight = 0;
  },

  aim(wx, wy) {
    const ty = Math.max(wy, Tuning.AIM_MIN_Y);
    this.targetAngle = Math.atan2(ty - this.y, wx - this.x);
  },

  muzzle() {
    return {
      x: this.x + Math.cos(this.angle) * (Tuning.BARREL_LEN - this.recoil * 0.18),
      y: this.y + Math.sin(this.angle) * (Tuning.BARREL_LEN - this.recoil * 0.18),
    };
  },

  tryShoot(wx, wy) {
    if (Game.state !== 'playing') return;
    if (Conveyor.dangerActive) {
      SFX.dryFire(); // shot blocked while the rail is full — sound only, no toast
      return;
    }
    if (this.ammo <= 0) {
      SFX.dryFire();
      HUD.ammoEmptyFeedback();
      return;
    }
    if (this.cooldown > 0) return;
    this.cooldown = Tuning.SHOT_COOLDOWN;
    this.aim(wx, wy);
    this.angle = this.targetAngle; // snap on fire, ease otherwise
    const m = this.muzzle();
    const ty = Math.max(wy, Tuning.AIM_MIN_Y);
    Entities.spawnCannonball(m.x, m.y, wx, ty);
    this.inFlight++;
    this.ammo--;
    Game.shotsFired++;
    this.recoil = 1;
    Cam.addTrauma(0.18);
    const sdx = Math.cos(this.angle), sdy = Math.sin(this.angle);
    Particles.spark(m.x, m.y, sdx, sdy);
    SFX.fire();
    Haptics.buzz(10);
    HUD.setAmmo(this.ammo);
    if (this.ammo === 10 || this.ammo === 5) SFX.ammoLow();
  },

  update(dt) {
    this.cooldown = Math.max(0, this.cooldown - dt);
    this.recoil = Math.max(0, this.recoil - dt * 5);
    // ease barrel toward aim
    let diff = this.targetAngle - this.angle;
    while (diff > Math.PI) diff -= Math.PI * 2;
    while (diff < -Math.PI) diff += Math.PI * 2;
    this.angle += diff * Math.min(1, 14 * dt);
  },
};

/* =====================================================================
   15 GAME — state machine (port of GameManager.cs semantics)
   ===================================================================== */
const Game = {
  state: 'splash', // splash | playing | won | failed
  levelIndex: 0, // always open at Level 1; arrows / NEXT LEVEL navigate
  currentLevel() { return LEVELS[this.levelIndex]; },
  hasNextLevel() { return this.levelIndex < LEVELS.length - 1; },
  nextLevel() {
    if (this.hasNextLevel()) this.levelIndex++;
    else this.levelIndex = 0; // finished the last level -> loop back to Level 1
    this.start();
  },
  shotsFired: 0, shotsHit: 0,
  boxesCleared: 0, totalBoxesAtStart: 0, combo: 0, bestCombo: 0, comboTimer: 0,

  start() {
    this.reset();
    this.state = 'playing';
  },

  reset() {
    Tween.killAll();
    Particles.clear();
    FloatText.clear();
    const { cells, counts } = this.currentLevel().build();
    Entities.reset(cells);
    Boxes.init(counts);
    this.totalBoxesAtStart = Boxes.totalBoxes;
    IceBlocker.reset();
    Locks.reset();
    Conveyor.reset();
    Cannon.reset();
    Cam.trauma = 0;
    this.shotsFired = 0; this.shotsHit = 0;
    this.boxesCleared = 0; this.combo = 0; this.bestCombo = 0; this.comboTimer = 0;
    HUD.reset();
  },

  onBoxCleared(box) {
    this.boxesCleared++;
    HUD.setProgress(this.totalBoxesAtStart ? this.boxesCleared / this.totalBoxesAtStart : 0);
    this.combo = this.comboTimer > 0 ? this.combo + 1 : 1;
    this.comboTimer = Tuning.COMBO_WINDOW;
    this.bestCombo = Math.max(this.bestCombo, this.combo);
    SFX.boxComplete(this.combo);
    if (this.combo >= 2) {
      FloatText.spawn(box.x, box.y + 0.3, `COMBO x${this.combo}`, '#ffb830', 0.3);
      if (this.combo >= 3) FloatText.spawn(0, 5.6, pick(['SWEET!', 'TASTY!', 'YUM!']), Palette.pink.base, 0.42);
    } else {
      FloatText.spawn(box.x, box.y + 0.3, 'CLEAR!', Palette[box.color].base, 0.28);
    }
  },

  win() {
    if (this.state !== 'playing') return;
    this.state = 'won';
    SFX.win();
    Haptics.buzz([20, 40, 20, 40, 60]);
    Cam.addTrauma(0.2);
    for (let i = 0; i < 3; i++)
      Tween.delay(i * 0.18, () => Particles.confetti(rand(-1.6, 1.6), rand(4, 7)));
    Tween.delay(0.85, () => HUD.showEnd(true, ''));
  },

  fail(reason) {
    if (this.state !== 'playing') return;
    this.state = 'failed';
    this.failReason = reason;
    SFX.fail();
    Haptics.buzz(80);
    Cam.addTrauma(0.45);
    // show cause first, consequence after (fail-cause-before-consequence rule)
    Tween.delay(0.6, () => HUD.showEnd(false, reason));
  },

  update(dt) {
    if (this.state !== 'playing') return;
    if (this.comboTimer > 0) {
      this.comboTimer -= dt;
      if (this.comboTimer <= 0) this.combo = 0;
    }
    // Out of ammo check — identical semantics to GameManager.LateUpdate
    if (Cannon.ammo <= 0 && Cannon.inFlight <= 0 && Entities.remaining > 0)
      this.fail('Out of ammo!');
  },
};

/* =====================================================================
   16 HUD — DOM overlay
   ===================================================================== */
const HUD = {
  el: {
    progressBar: document.getElementById('progress-bar'),
    progressLabel: document.getElementById('progress-label'),
    ammoPill: document.getElementById('ammo-pill'),
    ammoCount: document.getElementById('ammo-count'),
    overlay: document.getElementById('overlay'),
    panelIcon: document.getElementById('panel-icon'),
    panelTitle: document.getElementById('panel-title'),
    panelReason: document.getElementById('panel-reason'),
    panelStats: document.getElementById('panel-stats'),
    toast: document.getElementById('toast'),
    btnSound: document.getElementById('btn-sound'),
    btnHaptics: document.getElementById('btn-haptics'),
  },
  toastTimer: null,
  lastProgress: -1,

  reset() {
    this.el.overlay.classList.remove('show');
    document.getElementById('level-badge').textContent = 'LEVEL ' + Game.currentLevel().name;
    document.getElementById('btn-prev').disabled = Game.levelIndex <= 0;
    document.getElementById('btn-next').disabled = Game.levelIndex >= LEVELS.length - 1;
    this.setAmmo(Cannon.ammo);
    this.el.ammoPill.classList.remove('low', 'critical', 'empty');
    this.setProgress(0);
  },

  setAmmo(n) {
    this.el.ammoCount.textContent = n;
    this.el.ammoPill.classList.toggle('low', n < 20 && n >= 10);
    this.el.ammoPill.classList.toggle('critical', n < 10);
  },

  ammoEmptyFeedback() {
    const p = this.el.ammoPill;
    p.classList.remove('empty');
    void p.offsetWidth; // restart animation
    p.classList.add('empty');
    this.toast('OUT OF AMMO!');
  },

  setProgress(k) {
    const pct = Math.round(k * 100);
    if (pct === this.lastProgress) return;
    this.lastProgress = pct;
    this.el.progressBar.style.width = pct + '%';
    this.el.progressLabel.textContent = pct + '%';
  },

  toast(msg) {
    const t = this.el.toast;
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(this.toastTimer);
    this.toastTimer = setTimeout(() => t.classList.remove('show'), 1400);
  },

  countUp(el, target, suffix) {
    const obj = { v: 0 };
    Tween.add({
      dur: 0.7, ease: Ease.outCubic,
      update: k => { el.textContent = Math.round(target * k) + (suffix || ''); },
    });
  },

  showEnd(won, reason) {
    const e = this.el;
    e.panelIcon.textContent = won ? '🎉' : '💥';
    e.panelTitle.textContent = won ? 'LEVEL COMPLETE!' : 'LEVEL FAILED';
    e.panelTitle.classList.toggle('fail', !won);
    e.panelReason.textContent = won ? 'Every box cleared — delicious!' : reason;
    const acc = Game.shotsFired ? Math.round(100 * Game.shotsHit / Game.shotsFired) : 0;
    e.panelStats.innerHTML =
      '<div class="stat"><div class="k">Shots Used</div><div class="v" id="st-shots">0</div></div>' +
      '<div class="stat"><div class="k">Accuracy</div><div class="v" id="st-acc">0%</div></div>' +
      '<div class="stat"><div class="k">Boxes</div><div class="v" id="st-box">0</div></div>' +
      '<div class="stat"><div class="k">Best Combo</div><div class="v" id="st-combo">x0</div></div>';
    e.overlay.classList.add('show');
    this.countUp(document.getElementById('st-shots'), Game.shotsFired);
    this.countUp(document.getElementById('st-acc'), acc, '%');
    this.countUp(document.getElementById('st-box'), Game.boxesCleared);
    const cb = document.getElementById('st-combo');
    Tween.add({ dur: 0.7, ease: Ease.outCubic, update: k => { cb.textContent = 'x' + Math.round(Game.bestCombo * k); } });
    document.getElementById('btn-restart').textContent =
      won ? (Game.hasNextLevel() ? 'NEXT LEVEL' : 'PLAY AGAIN') : 'RETRY';
  },

  syncToggles() {
    this.el.btnSound.classList.toggle('off', SFX.muted);
    this.el.btnHaptics.classList.toggle('off', !Haptics.enabled);
  },
};

/* =====================================================================
   17 INPUT
   ===================================================================== */
const Input = {
  aimX: 0, aimY: 6, aimAge: 99, pointerDown: false,
  drag: null, // {mode:'pending'|'rotate', startClientX, startClientY, angle0, wx, wy}
  // True when the world point is inside the live model's bounding box (with a
  // small margin) — presses here may become a rotate-drag instead of a shot.
  overObject(w) {
    let minX = 1e9, maxX = -1e9, minY = 1e9, maxY = -1e9;
    for (const v of Entities.voxels) {
      if (!v.alive) continue;
      const p = Object3D.center(v);
      if (p.x < minX) minX = p.x; if (p.x > maxX) maxX = p.x;
      if (p.y < minY) minY = p.y; if (p.y > maxY) maxY = p.y;
    }
    if (minX > maxX) return false;
    const m = 0.3;
    return w.x > minX - m && w.x < maxX + m && w.y > minY - m && w.y < maxY + m;
  },
  init() {
    const game = document.getElementById('game');
    const splash = document.getElementById('splash');

    splash.addEventListener('pointerdown', e => {
      e.stopPropagation();
      SFX.unlock();
      splash.classList.add('hide');
      Game.start();
    });

    game.addEventListener('pointerdown', e => {
      SFX.unlock();
      if (e.target.closest('.tog') || e.target.closest('.btn') || e.target.closest('.overlay')) return;
      const w = Cam.toWorld(e.clientX - game.getBoundingClientRect().left,
                            e.clientY - game.getBoundingClientRect().top);
      this.aimX = w.x; this.aimY = w.y; this.aimAge = 0;
      this.pointerDown = true;
      Cannon.aim(w.x, w.y);
      if (Game.state === 'playing' && this.overObject(w)) {
        // On the object: wait to see whether this press becomes a rotate-drag.
        // A quick tap (released without moving) still shoots on pointerup.
        this.drag = { mode: 'pending', startClientX: e.clientX, startClientY: e.clientY,
                      angle0: Object3D.angle, angleX0: Object3D.angleX, wx: w.x, wy: w.y };
      } else {
        Cannon.tryShoot(w.x, w.y);
      }
    });
    game.addEventListener('pointermove', e => {
      const r = game.getBoundingClientRect();
      const w = Cam.toWorld(e.clientX - r.left, e.clientY - r.top);
      this.aimX = w.x; this.aimY = w.y; this.aimAge = 0;
      if (this.drag && this.pointerDown) {
        const dx = e.clientX - this.drag.startClientX;
        const dy = e.clientY - this.drag.startClientY;
        if (this.drag.mode === 'pending' && Math.hypot(dx, dy) > 9) this.drag.mode = 'rotate';
        if (this.drag.mode === 'rotate') {
          Object3D.angle = this.drag.angle0 + dx * 0.011;   // horizontal drag: yaw
          Object3D.angleX = this.drag.angleX0 + dy * 0.011; // vertical drag: pitch (unlimited)
          return; // don't re-aim the cannon while spinning
        }
      }
      if (Game.state === 'playing') Cannon.aim(w.x, w.y);
    });
    const up = () => {
      this.pointerDown = false;
      if (this.drag) {
        // Released without dragging: it was a tap on the object — shoot there.
        if (this.drag.mode === 'pending' && Game.state === 'playing') Cannon.tryShoot(this.drag.wx, this.drag.wy);
        this.drag = null;
      }
    };
    game.addEventListener('pointerup', up);
    game.addEventListener('pointercancel', up);
    game.addEventListener('contextmenu', e => e.preventDefault());

    HUD.el.btnSound.addEventListener('click', () => {
      SFX.unlock();
      SFX.setMuted(!SFX.muted);
      HUD.syncToggles();
      SFX.click();
    });
    HUD.el.btnHaptics.addEventListener('click', () => {
      Haptics.set(!Haptics.enabled);
      HUD.syncToggles();
      SFX.click();
      if (Haptics.enabled) Haptics.buzz(15);
    });
    const switchLevel = (delta) => {
      const idx = clamp(Game.levelIndex + delta, 0, LEVELS.length - 1);
      if (idx === Game.levelIndex) return;
      SFX.unlock();
      SFX.click();
      Game.levelIndex = idx;
      HUD.el.overlay.classList.remove('show');
      document.getElementById('splash').classList.add('hide');
      Game.start();
    };
    document.getElementById('btn-prev').addEventListener('click', () => switchLevel(-1));
    document.getElementById('btn-next').addEventListener('click', () => switchLevel(1));
    document.getElementById('btn-restart').addEventListener('click', () => {
      SFX.click();
      HUD.el.overlay.classList.remove('show');
      if (Game.state === 'won') Game.nextLevel(); // last level loops back to Level 1
      else Game.start();
    });
  },
  update(dt) { this.aimAge += dt; },
};

/* =====================================================================
   18 RENDER — pseudo-3D candy-shop pipeline
   ===================================================================== */
const Render = {
  bg: null, vignette: null,

  rebuildStatics() {
    const W = Cam.W, H = Cam.H, S = Cam.S;
    if (!W || !H) return;
    // --- background ---
    const bg = document.createElement('canvas');
    bg.width = W; bg.height = H;
    const b = bg.getContext('2d');
    const sky = b.createLinearGradient(0, 0, 0, H);
    sky.addColorStop(0, '#ffe9f4');
    sky.addColorStop(0.45, '#e8f2ff');
    sky.addColorStop(0.78, '#dff3ff');
    sky.addColorStop(1, '#fdeed3');
    b.fillStyle = sky;
    b.fillRect(0, 0, W, H);
    // soft counter band behind cannon
    const counterY = Cam.wy(1.55);
    const cg = b.createLinearGradient(0, counterY, 0, H);
    cg.addColorStop(0, 'rgba(255,236,205,0)');
    cg.addColorStop(0.25, 'rgba(255,236,205,0.85)');
    cg.addColorStop(1, '#ffe3b8');
    b.fillStyle = cg;
    b.fillRect(0, counterY, W, H - counterY);
    b.fillStyle = 'rgba(255,255,255,0.55)';
    b.fillRect(0, counterY + H * 0.028, W, Math.max(1.5, S * 0.02));
    // bokeh
    for (let i = 0; i < 12; i++) {
      const r = rand(0.25, 0.8) * S;
      b.globalAlpha = rand(0.04, 0.1);
      b.fillStyle = pick(['#ffffff', '#ffd3ec', '#c8e8ff']);
      b.beginPath();
      b.arc(rand(0, W), rand(0, H * 0.75), r, 0, Math.PI * 2);
      b.fill();
    }
    b.globalAlpha = 1;
    this.bg = bg;
    // --- vignette ---
    const vg = document.createElement('canvas');
    vg.width = W; vg.height = H;
    const v = vg.getContext('2d');
    const g = v.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.45, W / 2, H / 2, Math.max(W, H) * 0.75);
    g.addColorStop(0, 'rgba(90,40,80,0)');
    g.addColorStop(1, 'rgba(90,40,80,0.16)');
    v.fillStyle = g;
    v.fillRect(0, 0, W, H);
    this.vignette = vg;
  },

  roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  },

  softFace(points, inset=0) {
    const cx=points.reduce((n,p)=>n+p.x,0)/points.length;
    const cy=points.reduce((n,p)=>n+p.y,0)/points.length;
    const q=points.map(p=>({x:p.x+(cx-p.x)*inset,y:p.y+(cy-p.y)*inset}));
    ctx.beginPath();
    for(let i=0;i<q.length;i++){
      const a=q[(i+q.length-1)%q.length],b=q[i],c=q[(i+1)%q.length];
      const x=b.x+(a.x-b.x)*.018,y=b.y+(a.y-b.y)*.018;
      if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);
      ctx.quadraticCurveTo(b.x,b.y,b.x+(c.x-b.x)*.018,b.y+(c.y-b.y)*.018);
    }
    ctx.closePath();
  },


  drawVoxels() {
    const faces = [];
    for (const v of Entities.voxels) {
      if (!v.alive || v.scale < .01) continue;
      faces.push(...Object3D.faces(v));
    }
    faces.sort((a,b)=>a.depth-b.depth);
    for (const face of faces) {
      const {v,points,side}=face, pal=Palette[v.color];
      const screen=points.map(p=>({x:Cam.wx(p.x),y:Cam.wy(p.y)}));
      const left=Math.min(...screen.map(p=>p.x)),top=Math.min(...screen.map(p=>p.y));
      const right=Math.max(...screen.map(p=>p.x)),bottom=Math.max(...screen.map(p=>p.y));
      if((right-left)*(bottom-top)<.3)continue;
      this.softFace(screen);
      const [nx,ny,nz]=[[0,0,-1],[0,0,1],[-1,0,0],[1,0,0],[0,1,0],[0,-1,0]][side];
      // rotate the face normal through yaw then pitch so shading tracks both axes
      const c=Math.cos(Object3D.angle),s=Math.sin(Object3D.angle);
      const cx2=Math.cos(Object3D.angleX),sx2=Math.sin(Object3D.angleX);
      const rnx=nx*c+nz*s, rnz1=-nx*s+nz*c;
      const rny=ny*cx2-rnz1*sx2, rnz=ny*sx2+rnz1*cx2;
      const light=rnx*-.4+rny*.65+rnz*.64;
      const [hue,sat,lum]=hexToHsl(pal.base);
      const variation=Math.sin(v.x*43.7+v.y*19.3+v.z*7.1)*.65;
      const faceLum=Math.max(14,Math.min(88,lum+light*13-6+variation));
      const surface=ctx.createLinearGradient(left,top,right,bottom);
      surface.addColorStop(0,hsl(hue,sat*.66,Math.min(90,faceLum+.6)));
      surface.addColorStop(1,hsl(hue,sat*.66,Math.max(12,faceLum-.6)));
      ctx.fillStyle=surface;ctx.fill();
      // Fine contact seams, no bright borders or padded/inset frames.
      ctx.strokeStyle='rgba(34,32,37,.15)';
      ctx.lineWidth=Math.max(.4,Cam.S*.007);ctx.stroke();
      if(v.iced && v.iceAlpha>.01) {
        ctx.fillStyle=`rgba(144,225,249,${v.iceAlpha*.65})`;ctx.fill();
        ctx.strokeStyle=`rgba(232,252,255,${v.iceAlpha*.9})`;ctx.lineWidth=1.3;ctx.stroke();
        if(v.iceFlash>.02){ctx.fillStyle=`rgba(255,255,255,${v.iceFlash*.35})`;ctx.fill();}
      }
      if(v.locked){ // locked: solid stone-gray, clearly inert until unlocked
        ctx.fillStyle='rgba(106,104,122,.62)';ctx.fill();
        ctx.strokeStyle='rgba(58,56,74,.5)';ctx.lineWidth=Math.max(.6,Cam.S*.012);ctx.stroke();
      }
      if(v.hitFlash>.02){ctx.fillStyle=`rgba(255,255,255,${v.hitFlash*.45})`;ctx.fill();}
    }
    // HP badges. A badge is hidden only when a nearer cube sits almost exactly
    // in front of its cube (true occlusion, e.g. the model faces away) — not
    // merely because a plain neighbor projects nearby while the model rotates.
    // Badges still keep a minimum spacing among themselves for readability.
    const occupied=[], badges=[];
    for(const v of Entities.voxels.filter(v=>v.alive&&!v.dying).sort((a,b)=>Object3D.center(b).depth-Object3D.center(a).depth)) {
      const p=Object3D.center(v), x=Cam.wx(p.x), y=Cam.wy(p.y);
      if(v.hp>1
        && !occupied.some(q=>Math.hypot(q.x-x,q.y-y)<Cam.S*.11)
        && !badges.some(q=>Math.hypot(q.x-x,q.y-y)<Cam.S*.22))
        badges.push({x,y,hp:v.hp});
      occupied.push({x,y});
      v.hitFlash*=.86;
      v.iceFlash*=.84;
    }
    for(const b of badges) {
      ctx.fillStyle='rgba(255,255,255,.9)';ctx.beginPath();ctx.arc(b.x,b.y,Cam.S*.105,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#c2246c';
      ctx.font=`700 ${Cam.S*.15}px Fredoka,sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillText(b.hp,b.x,b.y);
    }
  },



  drawFunnel() {
    const S=Cam.S;
    ctx.save();
    ctx.lineCap='round';ctx.lineJoin='round';
    // Open collector: two continuous rails, leaving the falling marbles visible.
    for(const sign of [-1,1]) {
      const x1=Cam.wx(sign*2.9),y1=Cam.wy(6.73);
      const x2=Cam.wx(sign*.35),y2=Cam.wy(5.61);
      const x3=Cam.wx(sign*.5),y3=Cam.wy(5.0);
      const path=(dy=0)=>{
        ctx.beginPath();ctx.moveTo(x1,y1+dy);
        ctx.lineTo(x2,y2+dy);ctx.lineTo(x3,y3+dy);
      };
      // Small offset underside gives thickness without a solid bowl.
      path(.045*S);ctx.strokeStyle='rgba(103,78,139,.18)';ctx.lineWidth=.18*S;ctx.stroke();
      path();ctx.strokeStyle='#a68cbe';ctx.lineWidth=.17*S;ctx.stroke();
      const surface=ctx.createLinearGradient(0,y1-.06*S,0,y3);
      surface.addColorStop(0,'#e5d8f0');surface.addColorStop(.6,'#cbb5df');surface.addColorStop(1,'#bca3d3');
      path(-.015*S);ctx.strokeStyle=surface;ctx.lineWidth=.115*S;ctx.stroke();
      path(-.045*S);ctx.strokeStyle='rgba(255,255,255,.65)';ctx.lineWidth=.025*S;ctx.stroke();
      // Compact rounded end cap, matching the rail rather than a large rim.
      ctx.beginPath();ctx.arc(x1,y1,.084*S,0,Math.PI*2);
      ctx.fillStyle='#ded0ec';ctx.fill();
      ctx.beginPath();ctx.arc(x1-.018*S,y1-.022*S,.025*S,0,Math.PI*2);
      ctx.fillStyle='rgba(255,255,255,.65)';ctx.fill();
    }
    ctx.restore();
  },


  stadiumPath(inset) {
    const S = Cam.S;
    const halfW = Tuning.LANE_LENGTH / 2 + Tuning.LANE_HALF_HEIGHT;
    const x = Cam.wx(-halfW) - inset, y = Cam.wy(Tuning.CONVEYOR_Y + Tuning.LANE_HALF_HEIGHT) - inset;
    const w = halfW * 2 * S + inset * 2, h = Tuning.LANE_HALF_HEIGHT * 2 * S + inset * 2;
    this.roundRect(x, y, w, h, h / 2);
  },

  drawConveyor() {
    const S = Cam.S;
    const fill = Conveyor.count / CAPACITY;
    // groove color: gray -> amber -> red
    let groove;
    if (fill < 0.6) groove = '#b9c3d6';
    else if (fill < 0.82) groove = '#e8b46a';
    else groove = '#ef7a72';
    const dangerPulse = Conveyor.dangerActive && !REDUCED.on
      ? 0.5 + 0.5 * Math.sin(Cam.time * 18) : (Conveyor.dangerActive ? 1 : 0);
    const pulse = Conveyor.dangerActive ? dangerPulse :
      (Conveyor.count >= Tuning.RAIL_WARN_AT && !REDUCED.on
        ? 0.5 + 0.5 * Math.sin(Cam.time * 10) : 0);
    if (Conveyor.dangerActive) groove = '#ff3b30';
    // outer chrome
    this.stadiumPath(0);
    ctx.strokeStyle = '#8f86b8';
    ctx.lineWidth = 0.30 * S;
    ctx.stroke();
    // groove
    this.stadiumPath(0);
    ctx.strokeStyle = groove;
    ctx.lineWidth = 0.21 * S;
    ctx.stroke();
    if (pulse > 0) {
      this.stadiumPath(0);
      ctx.globalAlpha = Conveyor.dangerActive ? (0.42 + pulse * 0.48) : pulse * 0.45;
      ctx.strokeStyle = '#ff3b30';
      ctx.lineWidth = (Conveyor.dangerActive ? 0.31 : 0.24) * S;
      ctx.stroke();
      ctx.globalAlpha = 1;
    }
    // moving belt ticks
    ctx.fillStyle = 'rgba(255,255,255,0.55)';
    const start = Conveyor.baseOffset % RAIL_SLOT_SPACING;
    for (let d = start; d < PATH_LENGTH; d += RAIL_SLOT_SPACING) {
      const p = Conveyor.pathPoint(d);
      ctx.beginPath();
      ctx.arc(Cam.wx(p.x), Cam.wy(p.y), 0.028 * S, 0, Math.PI * 2);
      ctx.fill();
    }
    // capacity pill (canvas-drawn, centered inside the conveyor)
    const px = Cam.wx(0), py = Cam.wy(Tuning.CONVEYOR_Y);
    const pw = 0.85 * S, ph = 0.34 * S;
    this.roundRect(px - pw / 2, py - ph / 2, pw, ph, ph / 2);
    ctx.fillStyle = Conveyor.dangerActive
      ? `rgba(235,48,48,${0.72 + dangerPulse * 0.24})`
      : (fill >= 0.82 ? 'rgba(255,90,82,0.92)' : 'rgba(255,250,244,0.92)');
    ctx.fill();
    ctx.strokeStyle = Conveyor.dangerActive ? '#a91313' : 'rgba(140,110,140,0.4)';
    ctx.lineWidth = Conveyor.dangerActive ? 2.2 : 1.5;
    ctx.stroke();
    ctx.fillStyle = (Conveyor.dangerActive || fill >= 0.82) ? '#fff' : '#5a3c56';
    ctx.font = `600 ${0.2 * S}px Fredoka, sans-serif`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    const capText = `${Conveyor.count}/${CAPACITY}`;
    ctx.fillText(capText, px, py + 0.01 * S);
  },

  drawMarble(m, rOverride) {
    const S = Cam.S;
    const r = (rOverride || m.r) * S;
    const sx = Cam.wx(m.x), sy = Cam.wy(m.y);
    const pal = Palette[m.color];
    const scX = 1 + (1 - m.sy) * 0.7, scY = m.sy;
    ctx.save();
    ctx.translate(sx, sy);
    ctx.scale(scX, scY);
    const g = ctx.createRadialGradient(-r * 0.32, -r * 0.36, r * 0.1, 0, 0, r * 1.15);
    g.addColorStop(0, pal.lighter);
    g.addColorStop(0.5, pal.base);
    g.addColorStop(1, pal.deep);
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fill();
    // specular
    ctx.fillStyle = 'rgba(255,255,255,0.85)';
    ctx.beginPath();
    ctx.ellipse(-r * 0.34, -r * 0.4, r * 0.26, r * 0.17, -0.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  },

  drawBoxes() {
    const S = Cam.S;
    const t = Boxes.bobT;
    for (let c = 0; c < Boxes.columns.length; c++) {
      const column = Boxes.columns[c];
      for (let r = column.length - 1; r >= 0; r--) {
        const box = column[r];
        if (!box.visible) continue;
        const isFront = r === 0;
        const bob = isFront && !REDUCED.on ? Math.sin(t * 2 + c * 1.3) * 0.012 : 0;
        const bx = Cam.wx(box.x), by = Cam.wy(box.y + bob);
        const sc = box.scale;

        // Slightly larger / deeper box so three marbles visibly fit side-by-side.
        const w = 0.84 * S * sc, h = 0.50 * S * sc;
        const pal = Palette[box.color];
        const alpha = isFront ? 1 : 0.55;

        ctx.save();
        ctx.translate(bx, by);
        ctx.globalAlpha = alpha;

        // Back wall / dark inner cavity.
        ctx.fillStyle = pal.deep;
        this.roundRect(-w * 0.46, -h * 0.58, w * 0.92, h * 0.66, h * 0.13);
        ctx.fill();

        // Inner rim highlight makes the cavity read as depth, rather than a flat panel.
        ctx.strokeStyle = 'rgba(255,255,255,0.35)';
        ctx.lineWidth = Math.max(1, 0.014 * S);
        this.roundRect(-w * 0.43, -h * 0.54, w * 0.86, h * 0.55, h * 0.11);
        ctx.stroke();

        // Side flaps / walls.
        ctx.fillStyle = pal.light;
        ctx.beginPath();
        ctx.moveTo(-w / 2, -h * 0.12); ctx.lineTo(-w / 2 - w * 0.08, -h * 0.52);
        ctx.lineTo(-w / 2 + w * 0.15, -h * 0.56); ctx.lineTo(-w / 2 + w * 0.21, -h * 0.08);
        ctx.closePath(); ctx.fill();
        ctx.beginPath();
        ctx.moveTo(w / 2, -h * 0.12); ctx.lineTo(w / 2 + w * 0.08, -h * 0.52);
        ctx.lineTo(w / 2 - w * 0.15, -h * 0.56); ctx.lineTo(w / 2 - w * 0.21, -h * 0.08);
        ctx.closePath(); ctx.fill();
        ctx.restore();

        // IMPORTANT: marbles are rendered inside the cavity BEFORE the front wall.
        // The front wall then masks their lower edge, so they visually sit in the box.
        if (isFront || box.placed > 0) {
          for (let i = 0; i < 3; i++) {
            const m = box.marbles[i];
            if (!m || m.state !== 'boxed') continue;
            m.x = box.x + (i - 1) * 0.23 * sc;
            m.y = box.y + bob + 0.11;
            ctx.globalAlpha = alpha;
            this.drawMarble(m, 0.095 * sc);
            ctx.globalAlpha = 1;
          }
        }

        // Front wall, drawn after marbles to create real-looking occlusion.
        ctx.save();
        ctx.translate(bx, by);
        ctx.globalAlpha = alpha;
        const frontTop = -h * 0.09;
        const frontH = h * 0.64;
        const fg = ctx.createLinearGradient(0, frontTop, 0, frontTop + frontH);
        fg.addColorStop(0, pal.base);
        fg.addColorStop(1, pal.dark);
        ctx.fillStyle = fg;
        this.roundRect(-w / 2, frontTop, w, frontH, h * 0.16);
        ctx.fill();
        ctx.strokeStyle = 'rgba(255,255,255,0.5)';
        ctx.lineWidth = Math.max(1, 0.018 * S);
        this.roundRect(-w / 2 + 1.5, frontTop + 1.5, w - 3, frontH - 3, h * 0.14);
        ctx.stroke();

        // Subtle top lip reinforces that the balls are behind the wall.
        ctx.strokeStyle = pal.light;
        ctx.lineWidth = Math.max(1.5, 0.028 * S);
        ctx.beginPath();
        ctx.moveTo(-w * 0.42, frontTop + 0.5);
        ctx.lineTo(w * 0.42, frontTop + 0.5);
        ctx.stroke();

        // Fill dots (n/3 indicator) moved lower so they don't overlap the marbles.
        for (let i = 0; i < 3; i++) {
          ctx.fillStyle = i < box.placed ? '#fff' : 'rgba(255,255,255,0.28)';
          ctx.beginPath();
          ctx.arc((i - 1) * w * 0.20, frontTop + frontH * 0.64, 0.032 * S * sc, 0, Math.PI * 2);
          ctx.fill();
        }

        // Key box cue: a prominent golden key badge on the front wall.
        if (box.isKey && !box.clearing) {
          const kx = w * 0.30, ky = frontTop + frontH * 0.34;
          const bob = 1 + 0.06 * Math.sin(Cam.time * 3 + box.x * 2);
          ctx.fillStyle = 'rgba(255,255,255,.94)';
          ctx.strokeStyle = 'rgba(120,90,20,.45)';
          ctx.lineWidth = Math.max(1, 0.014 * S * sc);
          ctx.beginPath();
          ctx.arc(kx, ky, 0.125 * S * sc * bob, 0, Math.PI * 2);
          ctx.fill(); ctx.stroke();
          if (!Render.drawSprite(Assets.key, kx, ky, 0.215 * S * sc * bob, -0.7)) {
            ctx.font = `${0.13 * S * sc}px sans-serif`;
            ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.fillText('🔑', kx, ky + 0.008 * S * sc);
          }
        }

        // Flamethrower hatch cue: a small metal/orange module under the trigger box.
        if (isFront && box.flameTrigger && !IceBlocker.melted) {
          const mw = w * 0.34, mh = h * 0.17;
          ctx.fillStyle = '#6f7890';
          this.roundRect(-mw / 2, h * 0.49, mw, mh, mh * 0.45);
          ctx.fill();
          ctx.fillStyle = '#ff9e3d';
          this.roundRect(-mw * 0.25, h * 0.515, mw * 0.50, mh * 0.32, mh * 0.16);
          ctx.fill();
        }
        ctx.restore();
      }
    }
  },

  // Draw one of the embedded golden sprites centered at (x,y) with the given
  // on-screen height, rotation and alpha. Returns false if not yet decoded so
  // callers can fall back to an emoji glyph.
  drawSprite(img, x, y, hPx, rot = 0, alpha = 1, glowBlur = 0) {
    if (!img.complete || !img.naturalWidth) return false;
    const w = hPx * img.naturalWidth / img.naturalHeight;
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(rot);
    ctx.globalAlpha *= alpha;
    if (glowBlur > 0) { ctx.shadowColor = 'rgba(255,205,70,.85)'; ctx.shadowBlur = glowBlur; }
    else { ctx.shadowColor = 'rgba(40,30,60,.35)'; ctx.shadowBlur = 6; ctx.shadowOffsetY = 2; }
    ctx.drawImage(img, -w / 2, -hPx / 2, w, hPx);
    ctx.restore();
    return true;
  },

  // One prominent golden padlock per locked group, centered on the group and
  // tracking it through rotation. Rattles when shots bounce off; pops open,
  // rises and fades when its key arrives.
  drawGroupLocks() {
    const S = Cam.S;
    for (const g of ['eyeL', 'eyeR', 'mouth']) {
      if (!Entities.voxels.some(v => v.lockGroup === g && v.locked && v.alive)) continue;
      const c = Locks.groupCenter(g);
      const shake = Locks.shake[g] || 0;
      const x = Cam.wx(c.x) + Math.sin(Cam.time * 46) * shake * S * 0.05;
      const y = Cam.wy(c.y);
      const pulse = 1 + 0.045 * Math.sin(Cam.time * 2.6) + shake * 0.18;
      const alpha = c.depth < 0 ? 0.4 : 1; // fade when the group faces away
      const rot = Math.sin(Cam.time * 46) * shake * 0.12;
      if (!this.drawSprite(Assets.lock, x, y, S * 0.52 * pulse, rot, alpha)) {
        ctx.save();
        ctx.globalAlpha = alpha;
        ctx.fillStyle = '#ffffff';
        ctx.beginPath(); ctx.arc(x, y, S * 0.20 * pulse, 0, Math.PI * 2); ctx.fill();
        ctx.font = `${S * 0.26 * pulse}px sans-serif`;
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText('🔒', x, y + S * 0.012);
        ctx.restore();
      }
    }
    for (const a of Locks.anims) {
      const k = Math.min(1, a.t / 0.75);
      const x = Cam.wx(a.x), y = Cam.wy(a.y + Ease.outQuad(k) * 0.7);
      const s = 1 + 0.9 * Ease.outBack(Math.min(1, k * 1.6));
      const rot = 0.4 * Math.sin(k * Math.PI * 3);
      if (!this.drawSprite(Assets.lock, x, y, S * 0.52 * s, rot, 1 - k * k, 18)) {
        ctx.save();
        ctx.globalAlpha = 1 - k * k;
        ctx.translate(x, y); ctx.rotate(rot);
        ctx.font = `${S * 0.30 * s}px sans-serif`;
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText('🔓', 0, 0);
        ctx.restore();
      }
    }
  },

  drawKeys() {
    for (const f of Locks.flights) {
      const p = Locks.pos(f);
      const x = Cam.wx(p.x), y = Cam.wy(p.y);
      const rot = Math.sin(p.k * Math.PI * 2) * 0.3 - 0.5;
      const s = 1 + 0.35 * Math.sin(p.k * Math.PI); // slight pop mid-flight
      if (!this.drawSprite(Assets.key, x, y, Cam.S * 0.48 * s, rot, 1, 14)) {
        ctx.save();
        ctx.translate(x, y); ctx.rotate(rot);
        ctx.font = `${Cam.S * 0.30 * s}px sans-serif`;
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText('🔑', 0, 0);
        ctx.restore();
      }
    }
  },

  drawIceBlocker() {
    if (!IceBlocker.enabled || !IceBlocker.triggered || IceBlocker.finished) return;
    const S = Cam.S;
    const lift = Ease.outBack(IceBlocker.nozzleLift);
    const sx = Cam.wx(IceBlocker.sourceX);
    const baseYWorld = IceBlocker.sourceY - 0.16 + lift * 0.28;
    const sy = Cam.wy(baseYWorld);

    // telescoping flamethrower unit emerging from below the completed box
    const bodyW = 0.30 * S, bodyH = 0.28 * S;
    ctx.save();
    ctx.translate(sx, sy);
    ctx.fillStyle = 'rgba(80,55,70,0.16)';
    ctx.beginPath(); ctx.ellipse(0, bodyH * 0.58, bodyW * 0.75, bodyH * 0.22, 0, 0, Math.PI * 2); ctx.fill();
    const mg = ctx.createLinearGradient(-bodyW / 2, 0, bodyW / 2, 0);
    mg.addColorStop(0, '#727b91'); mg.addColorStop(0.5, '#d6dbe6'); mg.addColorStop(1, '#626b82');
    ctx.fillStyle = mg;
    this.roundRect(-bodyW / 2, -bodyH / 2, bodyW, bodyH, bodyW * 0.20);
    ctx.fill();
    ctx.fillStyle = '#ff8a30';
    this.roundRect(-bodyW * 0.24, -bodyH * 0.20, bodyW * 0.48, bodyH * 0.26, bodyH * 0.10);
    ctx.fill();
    // nozzle
    ctx.fillStyle = '#4f586d';
    this.roundRect(-0.075 * S, -0.34 * S, 0.15 * S, 0.24 * S, 0.06 * S);
    ctx.fill();
    ctx.fillStyle = '#ffb24a';
    ctx.beginPath(); ctx.ellipse(0, -0.36 * S, 0.10 * S, 0.055 * S, 0, 0, Math.PI * 2); ctx.fill();
    ctx.restore();

    if (IceBlocker.flame <= 0.01) return;
    const tx = Cam.wx(IceBlocker.targetX);
    const ty = Cam.wy(IceBlocker.targetY);
    const startY = sy - 0.39 * S;
    const f = IceBlocker.flame;
    const flick = Math.sin(Cam.time * 31) * 0.045 * S;
    const midX = (sx + tx) * 0.5 + Math.sin(Cam.time * 17) * 0.12 * S;
    const midY = (startY + ty) * 0.5 + flick;

    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.lineCap = 'round';
    // outer orange plume
    ctx.globalAlpha = 0.78 * f;
    ctx.strokeStyle = '#ff6b2c';
    ctx.lineWidth = (0.30 + 0.05 * Math.sin(Cam.time * 23)) * S;
    ctx.beginPath(); ctx.moveTo(sx, startY); ctx.quadraticCurveTo(midX, midY, tx, ty); ctx.stroke();
    // hot yellow core
    ctx.globalAlpha = 0.88 * f;
    ctx.strokeStyle = '#ffd34d';
    ctx.lineWidth = (0.17 + 0.025 * Math.sin(Cam.time * 29 + 1)) * S;
    ctx.beginPath(); ctx.moveTo(sx, startY); ctx.quadraticCurveTo(midX - 0.04 * S, midY, tx, ty); ctx.stroke();
    // white core nearest the nozzle
    ctx.globalAlpha = 0.85 * f;
    ctx.strokeStyle = '#fff3b0';
    ctx.lineWidth = 0.075 * S;
    ctx.beginPath(); ctx.moveTo(sx, startY);
    ctx.quadraticCurveTo((sx + midX) * 0.5, (startY + midY) * 0.5, midX, midY);
    ctx.stroke();
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;
    ctx.restore();
  },

  drawCannonballs() {
    const S = Cam.S;
    for (const b of Entities.cannonballs) {
      const sx = Cam.wx(b.x), sy = Cam.wy(b.y);
      const px = Cam.wx(b.px), py = Cam.wy(b.py);
      // streak
      ctx.strokeStyle = 'rgba(58,61,82,0.35)';
      ctx.lineWidth = Tuning.CANNONBALL_RADIUS * 1.5 * S;
      ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(sx, sy); ctx.stroke();
      const depth = b.totalDist ? clamp(b.traveled / b.totalDist, 0, 1) : 0;
      const r = Tuning.CANNONBALL_RADIUS * (1 - depth * 0.3) * S;
      const g = ctx.createRadialGradient(sx - r * 0.3, sy - r * 0.3, r * 0.1, sx, sy, r);
      g.addColorStop(0, '#6a6f8e');
      g.addColorStop(1, '#22243a');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(sx, sy, r, 0, Math.PI * 2); ctx.fill();
    }
  },

  drawStar(x, y, r, color) {
    ctx.fillStyle = color;
    ctx.beginPath();
    for (let i = 0; i < 10; i++) {
      const rr = i % 2 === 0 ? r : r * 0.45;
      const a = -Math.PI / 2 + i * Math.PI / 5;
      const px = x + Math.cos(a) * rr, py = y + Math.sin(a) * rr;
      i === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
    }
    ctx.closePath();
    ctx.fill();
  },

  drawCannon() {
    const S = Cam.S;
    const cx = Cam.wx(Cannon.x), cy = Cam.wy(Cannon.y);
    // ---- contact shadow ----
    ctx.fillStyle = 'rgba(150,110,170,0.20)';
    ctx.beginPath();
    ctx.ellipse(cx, cy + 0.52 * S, 0.74 * S, 0.09 * S, 0, 0, Math.PI * 2);
    ctx.fill();

    // ---- lavender pedestal ----
    // bottom slab
    let g = ctx.createLinearGradient(0, cy + 0.28 * S, 0, cy + 0.56 * S);
    g.addColorStop(0, '#c3b0ee');
    g.addColorStop(0.7, '#a58ade');
    g.addColorStop(1, '#8a6fc7');
    ctx.fillStyle = g;
    this.roundRect(cx - 0.68 * S, cy + 0.28 * S, 1.36 * S, 0.27 * S, 0.13 * S);
    ctx.fill();
    // pink trim ring
    ctx.fillStyle = '#f78fbe';
    this.roundRect(cx - 0.56 * S, cy + 0.245 * S, 1.12 * S, 0.06 * S, 0.03 * S);
    ctx.fill();
    // top disc
    g = ctx.createLinearGradient(0, cy + 0.12 * S, 0, cy + 0.27 * S);
    g.addColorStop(0, '#cdbbf3');
    g.addColorStop(1, '#a98fd9');
    ctx.fillStyle = g;
    this.roundRect(cx - 0.5 * S, cy + 0.12 * S, 1.0 * S, 0.15 * S, 0.075 * S);
    ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.4)';
    this.roundRect(cx - 0.44 * S, cy + 0.135 * S, 0.88 * S, 0.045 * S, 0.022 * S);
    ctx.fill();

    // ---- barrel: bulbous pink mortar tube (rotated toward aim) ----
    const len = (Tuning.BARREL_LEN - Cannon.recoil * 0.12) * S;
    const a = -Cannon.angle;
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(a);
    // teardrop profile: narrow tail, fat bulge, slight neck, wide muzzle
    const bodyG = ctx.createLinearGradient(0, -0.3 * S, 0, 0.3 * S);
    bodyG.addColorStop(0, '#ff9fce');
    bodyG.addColorStop(0.45, '#f45fa2');
    bodyG.addColorStop(1, '#c93c78');
    ctx.fillStyle = bodyG;
    ctx.beginPath();
    ctx.moveTo(-0.10 * S, -0.15 * S);
    ctx.bezierCurveTo(0.02 * S, -0.335 * S, 0.30 * S, -0.335 * S, 0.48 * S, -0.215 * S);
    ctx.lineTo(len, -0.24 * S);
    ctx.lineTo(len, 0.24 * S);
    ctx.lineTo(0.48 * S, 0.215 * S);
    ctx.bezierCurveTo(0.30 * S, 0.335 * S, 0.02 * S, 0.335 * S, -0.10 * S, 0.15 * S);
    ctx.closePath();
    ctx.fill();
    // cream band with pink stripe edges
    ctx.fillStyle = '#f6ecdd';
    ctx.fillRect(0.44 * S, -0.235 * S, 0.17 * S, 0.47 * S);
    ctx.fillStyle = '#f78fbe';
    ctx.fillRect(0.42 * S, -0.24 * S, 0.035 * S, 0.48 * S);
    ctx.fillRect(0.60 * S, -0.24 * S, 0.035 * S, 0.48 * S);
    // glossy sweep on the bulge
    ctx.fillStyle = 'rgba(255,255,255,0.55)';
    ctx.beginPath();
    ctx.ellipse(0.17 * S, -0.15 * S, 0.16 * S, 0.055 * S, 0.12, 0, Math.PI * 2);
    ctx.fill();
    // muzzle: thick cream ring
    ctx.fillStyle = '#fff6e8';
    ctx.beginPath();
    ctx.ellipse(len, 0, 0.13 * S, 0.29 * S, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = 'rgba(210,180,150,0.5)';
    ctx.lineWidth = Math.max(1, 0.018 * S);
    ctx.beginPath();
    ctx.ellipse(len, 0, 0.13 * S, 0.29 * S, 0, 0, Math.PI * 2);
    ctx.stroke();
    // bore
    ctx.fillStyle = '#b23a70';
    ctx.beginPath();
    ctx.ellipse(len + 0.01 * S, 0, 0.066 * S, 0.185 * S, 0, 0, Math.PI * 2);
    ctx.fill();
    // loaded ball peeking out of the bore (hidden when out of ammo)
    if (Cannon.ammo > 0) {
      const ballG = ctx.createRadialGradient(len - 0.015 * S, -0.05 * S, 0.01 * S, len, 0, 0.16 * S);
      ballG.addColorStop(0, '#ffc3de');
      ballG.addColorStop(0.55, '#f45fa2');
      ballG.addColorStop(1, '#c93c78');
      ctx.fillStyle = ballG;
      ctx.beginPath();
      ctx.ellipse(len - 0.005 * S, 0, 0.052 * S, 0.15 * S, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.85)';
      ctx.beginPath();
      ctx.ellipse(len - 0.02 * S, -0.06 * S, 0.018 * S, 0.045 * S, 0, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();

    // ---- lavender arch brackets holding the barrel (drawn in front) ----
    for (const side of [-1, 1]) {
      const bx = cx + side * 0.38 * S;
      g = ctx.createLinearGradient(bx - 0.12 * S, 0, bx + 0.12 * S, 0);
      g.addColorStop(0, side < 0 ? '#c3b0ee' : '#a58ade');
      g.addColorStop(1, side < 0 ? '#a58ade' : '#8a6fc7');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.moveTo(bx - 0.14 * S, cy + 0.2 * S);
      ctx.lineTo(bx - 0.14 * S, cy - 0.04 * S);
      ctx.arc(bx, cy - 0.04 * S, 0.14 * S, Math.PI, 0);
      ctx.lineTo(bx + 0.14 * S, cy + 0.2 * S);
      ctx.closePath();
      ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,0.5)';
      ctx.lineWidth = Math.max(1, 0.02 * S);
      ctx.stroke();
      // cream button with pink center
      ctx.fillStyle = '#fff6e8';
      ctx.beginPath(); ctx.arc(bx, cy - 0.02 * S, 0.075 * S, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#f45fa2';
      ctx.beginPath(); ctx.arc(bx, cy - 0.01 * S, 0.04 * S, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.8)';
      ctx.beginPath(); ctx.arc(bx - 0.013 * S, cy - 0.025 * S, 0.013 * S, 0, Math.PI * 2); ctx.fill();
    }

    // ---- cream plaque with pink star ----
    ctx.fillStyle = '#fff6e8';
    this.roundRect(cx - 0.29 * S, cy + 0.30 * S, 0.58 * S, 0.22 * S, 0.11 * S);
    ctx.fill();
    ctx.strokeStyle = 'rgba(210,180,150,0.55)';
    ctx.lineWidth = Math.max(1, 0.018 * S);
    this.roundRect(cx - 0.29 * S, cy + 0.30 * S, 0.58 * S, 0.22 * S, 0.11 * S);
    ctx.stroke();
    this.drawStar(cx, cy + 0.41 * S, 0.075 * S, '#f45fa2');
  },
  frame() {
    const W = Cam.W, H = Cam.H;
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, W, H);
    if (this.bg) ctx.drawImage(this.bg, 0, 0);
    // camera shake
    ctx.save();
    ctx.translate(W / 2 + Cam.shakeX, H / 2 + Cam.shakeY);
    ctx.rotate(Cam.shakeRot);
    ctx.translate(-W / 2, -H / 2);

    this.drawVoxels();
    this.drawFunnel();
    this.drawConveyor();
    // marbles: riding/capturing/free/jumping/overflow (boxed drawn with boxes)
    for (const m of Entities.marbles) {
      if (m.state === 'boxed') continue;
      if (m.state === 'overflow') {
        ctx.globalAlpha = 0.5 + 0.5 * Math.sin(Cam.time * 20);
        this.drawMarble(m);
        ctx.globalAlpha = 1;
      } else if (m.state !== 'jumping') this.drawMarble(m);
    }
    this.drawBoxes();
    this.drawIceBlocker();
    this.drawGroupLocks();
    this.drawKeys();
    // jumping marbles pass in front of boxes
    for (const m of Entities.marbles) if (m.state === 'jumping') this.drawMarble(m);
    this.drawCannonballs();
    this.drawCannon();
    Particles.draw();
    FloatText.draw();
    ctx.restore();
    if (this.vignette) ctx.drawImage(this.vignette, 0, 0);
    this.drawFrame();
  },

  // subtle candy frame separating the playfield from the page
  drawFrame() {
    const W = Cam.W, H = Cam.H, d = Cam.dpr;
    const r = 16 * d, inset = 3 * d;
    ctx.strokeStyle = 'rgba(255,255,255,0.55)';
    ctx.lineWidth = 4 * d;
    this.roundRect(inset, inset, W - inset * 2, H - inset * 2, r);
    ctx.stroke();
    ctx.strokeStyle = 'rgba(255,140,190,0.28)';
    ctx.lineWidth = 1.5 * d;
    this.roundRect(inset + 3 * d, inset + 3 * d, W - (inset + 3 * d) * 2, H - (inset + 3 * d) * 2, r - 3 * d);
    ctx.stroke();
  },
};

/* =====================================================================
   19 MAIN LOOP — fixed 60 Hz update, rAF render
   ===================================================================== */
const DT = 1 / 60;
let last = performance.now();
let acc = 0;
const DEBUG = /[?&]debug/.test(location.search);
const DEMO = /[?&]demo/.test(location.search); // auto-plays for quick visual checks
let demoTimer = 0;
let fps = 0, fpsAcc = 0, fpsN = 0;

function step(dt) {
  Object3D.update(dt);
  if (DEMO && Game.state === 'playing') {
    demoTimer -= dt;
    if (demoTimer <= 0 && Cannon.cooldown <= 0 && Conveyor.count <= 9) {
      const alive = Entities.voxels.filter(v => v.alive && !v.dying && !v.iced);
      if (alive.length) {
        const v = alive[(Math.random() * alive.length) | 0];
        const p = Object3D.center(v);
        Input.aimX = p.x; Input.aimY = p.y; Input.aimAge = 0;
        Cannon.tryShoot(p.x + rand(-0.1, 0.1), p.y + rand(-0.1, 0.1));
        demoTimer = 0.8;
      }
    }
  }
  Tween.update(dt);
  Cam.update(dt);
  Input.update(dt);
  if (Game.state === 'playing') {
    Cannon.update(dt);
    Entities.updateCannonballs(dt);
    Entities.updateMarbles(dt);
    Conveyor.update(dt);
    Boxes.update(dt);
    IceBlocker.update(dt);
    Locks.update(dt);
    Game.update(dt);
    // Progress advances only when a 3-marble box is completed.
  }
  Particles.update(dt);
  FloatText.update(dt);
}

function loop(now) {
  requestAnimationFrame(loop);
  let dt = (now - last) / 1000;
  last = now;
  if (dt > 0.1) dt = 0.1; // tab-back protection
  acc += dt;
  let steps = 0;
  while (acc >= DT && steps < 5) { step(DT); acc -= DT; steps++; }
  if (steps === 5) acc = 0;
  Render.frame();
  if (DEBUG) {
    fpsAcc += dt; fpsN++;
    if (fpsAcc >= 0.5) { fps = Math.round(fpsN / fpsAcc); fpsAcc = 0; fpsN = 0; }
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = '#000';
    ctx.font = '12px monospace';
    ctx.textAlign = 'left';
    ctx.fillText(`${fps}fps marbles:${Entities.marbles.length} rail:${Conveyor.count}/${CAPACITY} tw:${Tween.list.length}`, 8, Cam.H - 8);
  }
}

/* =====================================================================
   INIT
   ===================================================================== */
window.addEventListener('resize', () => Cam.resize());
window.addEventListener('orientationchange', () => setTimeout(() => Cam.resize(), 120));
document.addEventListener('visibilitychange', () => { if (!document.hidden) last = performance.now(); });

window.__MC = { Object3D, Tuning, Palette, Level, LEVELS, Entities, IceBlocker, Conveyor, Boxes, Cannon, Game, Tween, Cam, HUD, Input, SFX, Haptics, step, CAPACITY, SLOT_COUNT, RAIL_SLOT_SPACING, PATH_LENGTH };
Input.init();
HUD.syncToggles();
Cam.resize();
Game.reset(); // pre-build the scene so it shows behind the splash
if (DEMO) {
  document.getElementById('splash').classList.add('hide');
  Game.start();
}
requestAnimationFrame(loop);
})();
</script>
